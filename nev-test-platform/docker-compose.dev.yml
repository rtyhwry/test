version: '3.8'

# Development compose file - use with: docker-compose -f docker-compose.dev.yml up

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: nev-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: nev_test_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Redis
  redis:
    image: redis:7-alpine
    container_name: nev-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data_dev:
